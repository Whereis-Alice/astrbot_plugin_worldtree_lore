<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WorldTree Lore responsive visual harness</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 28px;
        background: #d9e4dc;
        color: #17351f;
      }
      h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: .04em; }
      p.hint { margin: 0 0 24px; font-size: 13px; color: #3c5a45; }
      .cases { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
      figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
      figcaption { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #2c4d37; }
      .frame { overflow: hidden; border-radius: 18px; background: white; box-shadow: 0 22px 60px rgb(13 45 28 / 22%); }
      iframe { border: 0; display: block; transform-origin: 0 0; background: white; }
    </style>
  </head>
  <body>
    <h1>世界树管理台 · 断点预览</h1>
    <p class="hint">窄屏按 1:1 显示，宽屏按比例缩小以便同屏对照。缩放只影响预览容器，页面自身仍按标注的视口宽度渲染。</p>
    <div class="cases" id="cases"></div>
    <script>
      const CASES = [
        { label: "手机 390 × 844", width: 390, height: 844, scale: 1 },
        { label: "平板 834 × 1000", width: 834, height: 1000, scale: 0.62 },
        { label: "笔记本 1180 × 900", width: 1180, height: 900, scale: 0.46 },
        { label: "桌面 1440 × 1000", width: 1440, height: 1000, scale: 0.42 },
        { label: "宽屏 1660 × 1000", width: 1660, height: 1000, scale: 0.38 },
        { label: "超宽 1920 × 1080", width: 1920, height: 1080, scale: 0.34 },
      ];

      const host = document.getElementById("cases");
      for (const item of CASES) {
        const figure = document.createElement("figure");
        const caption = document.createElement("figcaption");
        caption.textContent = item.label;
        const frame = document.createElement("div");
        frame.className = "frame";
        frame.style.width = `${Math.round(item.width * item.scale)}px`;
        frame.style.height = `${Math.round(item.height * item.scale)}px`;
        const iframe = document.createElement("iframe");
        iframe.title = `世界树管理台 ${item.width} 宽预览`;
        iframe.src = "./visual_harness.html";
        iframe.width = item.width;
        iframe.height = item.height;
        iframe.style.transform = `scale(${item.scale})`;
        frame.append(iframe);
        figure.append(caption, frame);
        host.append(figure);
      }
    </script>
  </body>
</html>
